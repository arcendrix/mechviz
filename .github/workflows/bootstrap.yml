name: Bootstrap Mechviz

on:
  push:
    branches: [main]
    paths: [bootstrap.ready]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble project archive
        run: |
          cat bootstrap/part-* > /tmp/mechviz.tar.gz.b64
          base64 -d /tmp/mechviz.tar.gz.b64 > /tmp/mechviz.tar.gz
          tar -xzf /tmp/mechviz.tar.gz -C .
      - name: Remove bootstrap files
        run: |
          rm -rf bootstrap bootstrap.ready .github/workflows/bootstrap.yml
      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build complete Mechviz SaaS"
          git push
